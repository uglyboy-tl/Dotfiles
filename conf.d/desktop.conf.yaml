- defaults:
    link:
      create: true # 目标目录不存在时自动创建
      relink: true # 已存在的符号链接重新链接

- clean:
    ~/.local/share/applications/:
      force: true

# Shell 命令执行阶段
- shell:
    - [
        git submodule update --init --recursive desktop data || true,
        更新桌面相关 submodule 模块,
      ]

- link:
    ~/.local/bin/:
      create: true # 创建目标目录
      glob: true # 使用通配符匹配
      path: desktop/scripts/* # 源文件路径
      relink: true # 允许重新链接
    # 设置菜单入口（其余 settings/ 脚本由入口按绝对路径调用，不进 PATH）
    ~/.local/bin/settings: settings/settings
    # 快捷键执行菜单（选中即执行，仿 Omarchy）
    ~/.local/bin/keybindings: settings/setting-keybindings.sh
    ~/.local/share/applications/:
      create: true
      glob: true
      path: desktop/applications/*
      relink: true

    # 打开方式
    $XDG_CONFIG_HOME/mimeapps.list: desktop/mimeapps.list

    # Built-in：binup 二进制管理器配置（桌面机与树莓派各一份，目标路径相同，按环境二选一）
    $XDG_CONFIG_HOME/binup/config.toml: desktop/binup.toml # binup 包管理器配置

    ## Zathura PDF 阅读器
    $XDG_CONFIG_HOME/zathura: desktop/zathura

    # X Window 系统配置
    # 环境变量配置
    ~/.xsessionrc: config/environment # X session 环境变量
    ## Xresources 资源文件
    $XDG_CONFIG_HOME/X11/Xresources: desktop/X11/Xresources # X 资源定义
    $XDG_CONFIG_HOME/X11/Xresources.d/rxvt-unicode: desktop/X11/rxvt-unicode # URxvt 终端配置
    ## 字体配置
    $XDG_CONFIG_HOME/fontconfig/fonts.conf: desktop/fontconfig/fonts.conf # 字体配置文件
    ## GTK 设置（GTK3/GTK4 字体、主题名、暗色偏好；gtk.css 由主题渲染生成）
    $XDG_CONFIG_HOME/gtk-3.0/settings.ini:
      force: true # 覆盖既有的普通文件，改为软链
      path: desktop/gtk/gtk-3.0.ini
    $XDG_CONFIG_HOME/gtk-4.0/settings.ini:
      force: true
      path: desktop/gtk/gtk-4.0.ini
    ## BSPWM 窗口管理器生态
    $XDG_CONFIG_HOME/bspwm/bspwmrc: desktop/bspwm/bspwmrc # BSPWM 主配置
    $XDG_CONFIG_HOME/sxhkd/sxhkdrc: desktop/bspwm/sxhkdrc # 快捷键配置
    $XDG_CONFIG_HOME/picom/picom.conf: desktop/picom/picom.conf # 合成器配置
    $XDG_CONFIG_HOME/redshift/redshift.conf: desktop/redshift/redshift.conf # 屏幕色温调节（由 bspwmrc 启动）
    $XDG_CONFIG_HOME/polybar: desktop/polybar # 状态栏配置
    $XDG_CONFIG_HOME/rofi: desktop/rofi # 应用启动器（settings 主题由 selectors 按路径加载）
    $XDG_CONFIG_HOME/dunst/dunstrc: desktop/dunst/dunstrc # 桌面通知
    ## UDiskie 配置
    $XDG_CONFIG_HOME/udiskie/config.yml: desktop/udiskie/config.yml

    ## 动态壁纸
    $XDG_DATA_HOME/dynamic-wallpaper: data/dynamic-wallpaper # 动态壁纸资源

    ## Alacritty 终端模拟器
    $XDG_CONFIG_HOME/alacritty: desktop/alacritty
    ## Ghostty 终端模拟器
    $XDG_CONFIG_HOME/ghostty: desktop/ghostty

    ## FCITX5-RIME 输入法
    $XDG_DATA_HOME/fcitx5/rime: data/rime-ice # 默认输入方案
    $XDG_DATA_HOME/fcitx5/rime/default.custom.yaml: desktop/fcitx5/rime/default.custom.yaml # 默认输入方案
    $XDG_DATA_HOME/fcitx5/rime/luna_pinyin.custom.yaml: desktop/fcitx5/rime/luna_pinyin.custom.yaml # 拼音输入方案
    $XDG_DATA_HOME/fcitx5/rime/rime_ice.custom.yaml: desktop/fcitx5/rime/rime_ice.custom.yaml # 拼音输入方案
    ## fcitx5 本体配置（config 含热键/行为，classicui.conf 含主题/字体；缓存等运行时状态不纳管）
    $XDG_CONFIG_HOME/fcitx5/config:
      force: true # 覆盖既有的普通文件，改为软链
      path: desktop/fcitx5/config
    $XDG_CONFIG_HOME/fcitx5/conf/classicui.conf:
      force: true
      path: desktop/fcitx5/classicui.conf

    ## MPV 媒体播放器
    $XDG_CONFIG_HOME/mpv/mpv.conf: desktop/mpv/mpv.conf # MPV 主配置
    $XDG_CONFIG_HOME/mpv/scripts/thumbfast.lua: desktop/mpv/thumbfast/thumbfast.lua # 缩略图预览脚本
    $XDG_CONFIG_HOME/mpv/fonts: desktop/mpv/uosc/src/fonts # uosc 界面字体
    $XDG_CONFIG_HOME/mpv/scripts/uosc/char-conv: desktop/mpv/uosc/src/uosc/char-conv # 字符转换
    $XDG_CONFIG_HOME/mpv/scripts/uosc/elements: desktop/mpv/uosc/src/uosc/elements # 界面元素
    $XDG_CONFIG_HOME/mpv/scripts/uosc/intl: desktop/mpv/uosc/src/uosc/intl # 国际化
    $XDG_CONFIG_HOME/mpv/scripts/uosc/lib: desktop/mpv/uosc/src/uosc/lib # 库文件
    $XDG_CONFIG_HOME/mpv/scripts/uosc/main.lua: desktop/mpv/uosc/src/uosc/main.lua # uosc 主脚本
    $XDG_CONFIG_HOME/mpv/script-opts/uosc.conf: desktop/mpv/uosc.conf # uosc 配置文件

