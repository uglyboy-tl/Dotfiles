# 桌面环境包（apt）
# 注：ghostty、yazi 来自 griffo 第三方源，Debian 13 主线没有
# fontconfig / python3-gi / fcitx5 / pipewire-bin 由列表内其他包自动带上，不显式列出

- apt:
    # 窗口管理 / X 基础
    - bspwm
    - x11-xserver-utils
    - picom
    # 状态栏 / 启动器 / 通知 / 挂载
    - polybar
    - rofi
    - dunst
    - libnotify-bin
    - udiskie
    - dex
    - xdotool
    # 屏保 / 壁纸 / 色温
    - xprintidle
    - feh
    - redshift
    # 截图 / 剪贴板
    - maim
    - xclip
    # 亮度 / 音频
    - ddcutil
    - wireplumber
    # 蓝牙
    - bluez
    - bc
    # 输入法
    - fcitx5-rime
    # 终端 / 文档 / 媒体
    - ghostty
    - yazi
    - mpv
    - ncmpcpp
    # 脚本运行时
    - python3-dbus
