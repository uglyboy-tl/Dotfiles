- defaults:
    link:
      create: true # 目标目录不存在时自动创建
      relink: true # 已存在的符号链接重新链接

- link:
    ~/.local/bin/:
      create: true # 创建目标目录
      glob: true # 使用通配符匹配
      path: rpi/scripts/* # 源文件路径
      relink: true # 允许重新链接

    # Built-in：binup 二进制管理器配置（树莓派版，路径与桌面版不同）
    $XDG_CONFIG_HOME/binup/config.toml: rpi/binup.toml # binup 包管理器配置
    $XDG_CONFIG_HOME/zsh/zshrc.rpi: rpi/zshrc.rpi

    # herdr 远程桥接 server（session main）：让其它机器能用 herdr --machine 控制本机
    # 桌面机的默认 server 由 bspwmrc 起，所以这个 unit 只链在树莓派侧
    $XDG_CONFIG_HOME/systemd/user/herdr-main.service: config/herdr/herdr-main.service

# Crontab 定时任务配置
- crontab:
    - time: 0 0 * * * # 每天执行一次
      command: pg-back > /tmp/pg.log 2>&1
      platform: linux # 仅限 Linux 平台
