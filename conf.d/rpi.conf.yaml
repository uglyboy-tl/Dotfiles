- link:
    ~/.local/bin/:
      create: true # 创建目标目录
      glob: true # 使用通配符匹配
      path: rpi/scripts/* # 源文件路径
      relink: true # 允许重新链接

    # Built-in
    $XDG_CONFIG_HOME/binup/config.toml: rpi/builtin/binup.toml # UV 配置

    # Pi
    $XDG_CONFIG_HOME/pi/settings.json: rpi/pi/settings.json # Pi 主配置(含 powerline 等插件配置,运行时会自动写入)
    # bash login shell（pi-feishu-lark daemon 等 bash -lc 场景需要）
    ~/.profile: rpi/profile

# Crontab 定时任务配置
- crontab:
    - time: 0 0 * * * # 每天执行一次
      command: pg-back > /tmp/pg.log 2>&1
      platform: linux # 仅限 Linux 平台
