download_dir = "/srv/Dev/Work/Tools/CMD"

[packages.bun]
repo = "oven-sh/bun"
file_pattern = "bun-{os}-{arch}"
file_extension = "zip"

[packages.uv]
repo = "astral-sh/uv"
file_pattern = "uv-{arch}-unknown-{os}{libc}"
file_extension = "tar.gz"

[packages.rtk]
repo = "rtk-ai/rtk"
file_pattern = "rtk-{arch}-unknown-{os}{libc}"
file_extension = "tar.gz"

[packages.atuin]
repo = "atuinsh/atuin"
file_pattern = "atuin-{arch}-unknown-{os}{libc}"
file_extension = "tar.gz"

[packages.fd]
repo = "sharkdp/fd"
file_pattern = "fd-v*-{arch}-unknown-{os}{libc}"
file_extension = "tar.gz"

[packages.fzf]
repo = "junegunn/fzf"
file_pattern = "fzf-*-{os}_{arch}"
file_extension = "tar.gz"

[packages.gh]
repo = "cli/cli"
file_pattern = "gh_*_{os}_{arch}"
file_extension = "tar.gz"

[packages.ripgrep]
repo = "BurntSushi/ripgrep"
file_pattern = "ripgrep-*-{arch}-unknown-{os}{libc}"
file_extension = "tar.gz"

[packages.zoxide]
repo = "ajeetdsouza/zoxide"
file_pattern = "zoxide-*-{arch}-unknown-{os}{libc}"
file_extension = "tar.gz"

[packages.rclone]
repo = "rclone/rclone"
file_pattern = "rclone-v*-{os}-{arch}"
file_extension = "zip"

[packages.yt-dlp]
repo = "yt-dlp/yt-dlp"
file_pattern = "yt-dlp_{os}_{arch}"
binary_name = "yt-dlp"

[packages.fastfetch]
repo = "fastfetch-cli/fastfetch"
file_pattern = "fastfetch-{os}-{arch}"
file_extension = "tar.gz"
binary_name = "fastfetch"

[packages.sonar]
enabled = "false"
repo = "raskrebs/sonar"
file_pattern = "sonar_{os}_{arch}"
file_extension = "tar.gz"

[packages.chsrc]
enabled = "false"
repo = "RubyMetric/chsrc"
file_pattern = "chsrc-{arch}-{os}"
binary_name = "chsrc"
