[module/opencode]
type = custom/script
format-offset = 8pt
exec = $HOME/.local/share/dotfiles/desktop/polybar/scripts/opencode-quota.sh
tail = true
click-left = kill -USR1 $(pgrep --oldest --parent %pid%)

format = <label>
format-underline = ${colors.orange}
format-prefix = 󰊠
format-prefix-padding = 1
format-prefix-foreground = ${colors.background}
format-prefix-background = ${colors.orange}

label = %output%
label-font = 5
label-padding = 1
label-background = ${colors.semi-trans}