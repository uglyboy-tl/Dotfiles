[module/bspwm]
type = internal/bspwm

; 图标按 bspwmrc 桌面分配：D1 web / D2 办公 / D3 文件 / D4 媒体 / D5 聊天 / D6 代码
ws-icon-0 = I;
ws-icon-1 = II;
ws-icon-2 = III;
ws-icon-3 = IV;
ws-icon-4 = V;󰍡
ws-icon-5 = VI;

; 状态由颜色区分：聚焦=蓝底白字 / 占用=亮蓝 / 空闲=灰圆点
format = <label-state>
format-font = 2
format-foreground = ${colors.dark-foreground}
format-background = ${colors.semi-trans}

label-focused = %icon%
label-focused-foreground = ${colors.bright-foreground}
label-focused-background = ${colors.semi-trans}
label-focused-padding = 1

label-occupied = %icon%
label-occupied-foreground = ${colors.cyan}
label-occupied-background = ${colors.semi-trans}
label-occupied-padding = 1

label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-padding = 1

label-empty = 
label-empty-foreground = ${colors.dark-foreground}
label-empty-background = ${colors.semi-trans}
label-empty-padding = 1