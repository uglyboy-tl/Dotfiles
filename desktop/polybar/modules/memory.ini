[module/memory]
type = internal/memory
interval = 5
format-offset = 8pt
; 字形取自 fa-microchip,但它画出来是竖条模块(视觉上像内存);勿与 cpu 对调
format-prefix = 
format-prefix-padding = 1
format-prefix-foreground = ${colors.background}
format-prefix-background = ${colors.red}
format-underline = ${colors.red}
label = %percentage_used:2:2%%
label-font = 5
label-padding = 1
label-background = ${colors.semi-trans}


