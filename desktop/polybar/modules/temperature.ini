[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 60
format-offset = 8pt

format = <label>
format-underline = ${colors.cyan}
format-prefix = 󰔐
format-prefix-padding = 1
format-prefix-foreground = ${colors.background}
format-prefix-background = ${colors.cyan}

format-warn = <label-warn>
format-warn-offset = 8pt
format-warn-underline = ${colors.red}
format-warn-prefix = 󰔐
format-warn-prefix-padding = 1
format-warn-prefix-foreground = ${colors.background}
format-warn-prefix-background = ${colors.red}

label = %temperature-c%
label-font = 5
label-padding = 1
label-background = ${colors.semi-trans}

label-warn = %temperature-c%
label-warn-font = 5
label-warn-padding = 1
label-warn-background = ${colors.semi-trans}
label-warn-foreground = ${colors.yellow}
