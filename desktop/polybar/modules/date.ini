[module/date]
type = internal/date
interval = 10
time = %I:%M %p

; 硬约束：internal 模块的 click-left 不触发，须用 %{A} 包住整个 format；%{A1:...:} 内不能含冒号。
format = %{A1:$HOME/.local/share/dotfiles/desktop/polybar/scripts/rofi-calendar.py:}<label>%{A}
format-offset = 8pt
format-underline = ${colors.magenta}
format-prefix = "󰃭"
format-prefix-padding = 1
format-prefix-foreground = ${colors.background}
format-prefix-background = ${colors.magenta}

label = %time%
label-font = 5
label-padding = 1
label-background = ${colors.semi-trans}
