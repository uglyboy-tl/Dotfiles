[module/date]
type = custom/script
interval = 10
exec = date '+%I:%M %p'

format = <label>
format-offset = 8pt
format-underline = ${colors.magenta}
format-prefix = "󰃭"
format-prefix-padding = 1
format-prefix-foreground = ${colors.background}
format-prefix-background = ${colors.magenta}

label = %output%
label-font = 5
label-padding = 1
label-background = ${colors.semi-trans}

click-left = $HOME/.local/share/dotfiles/desktop/polybar/scripts/rofi-calendar.py
