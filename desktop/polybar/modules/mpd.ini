[module/mpd]
type = internal/mpd

host = 192.168.0.100
port = 6600

;Format
format-online-padding = 1
format-online-background = ${colors.semi-trans}
format-online-underline = ${colors.dark-foreground}
format-online = %{T3}<toggle> <icon-stop> <icon-prev>%{T-} <bar-progress> %{T3}<icon-next> · <icon-random> <icon-repeat>%{T-} <label-song>
format-stopped = <toggle>

label-song = %{T5}%artist:0:10:...% - %title%%{T-}
label-song-foreground = ${colors.dark-foreground}
label-song-maxlen = 30

;控制图标 - Font Awesome 实心系列(与 bspwm 统一风格)
icon-play = 
icon-play-foreground = ${colors.green}
icon-pause = 
icon-pause-foreground = ${colors.yellow}
icon-stop = 
icon-stop-foreground = ${colors.red}
icon-prev = 
icon-prev-foreground = ${colors.orange}
icon-next = 
icon-next-foreground = ${colors.orange}
icon-random = 
icon-repeat = 

toggle-on-foreground = #ee
toggle-off-foreground = #55

;进度条(bar-progress-indicator 是必填,改用短指示符)
bar-progress-width = 8
bar-progress-indicator = ▸
bar-progress-indicator-foreground = ${colors.dark-foreground}
bar-progress-fill = ▰
bar-progress-fill-foreground = #bb
bar-progress-empty = ▱
bar-progress-empty-foreground = #44607d
bar-progress-gradient = true
bar-progress-font = 2
bar-progress-foreground-0 = ${colors.sky}
bar-progress-foreground-1 = ${colors.sapphire}
bar-progress-foreground-2 = ${colors.blue}
bar-progress-foreground-3 = ${colors.teal}