[module/mpd]
type = internal/mpd

host = 192.168.0.100
port = 6600

;Format
format-online-offset = 8pt
format-online-padding = 1
format-online-background = ${colors.semi-trans}
format-online-underline = ${colors.light-background}
format-online = <toggle> <icon-stop> <icon-prev> <bar-progress> <icon-next> · <icon-random> <icon-repeat> <label-song>
format-stopped = <toggle>
format-stopped-offset = 8pt

label-song = %artist:0:10:...% - %title%
label-song-foreground = ${colors.dark-foreground}
label-song-maxlen = 30
label-song-font = 5

;控制图标 - Font Awesome 实心系列(与 bspwm 统一风格)
icon-play = 
icon-play-foreground = ${colors.green}
icon-play-font = 2
icon-pause = 
icon-pause-foreground = ${colors.yellow}
icon-pause-font = 2
icon-stop = 
icon-stop-foreground = ${colors.red}
icon-stop-font = 2
icon-prev = 
icon-prev-foreground = ${colors.orange}
icon-prev-font = 2
icon-next = 
icon-next-foreground = ${colors.orange}
icon-next-font = 2
icon-random = 
icon-repeat = 

toggle-on-foreground = #ee
toggle-off-foreground = #55

;进度条(bar-progress-indicator 是必填,改用短指示符)
bar-progress-width = 8
bar-progress-indicator = ▸
bar-progress-indicator-foreground = ${colors.dark-foreground}
bar-progress-fill = ▰
bar-progress-fill-foreground = #bb
bar-progress-empty = ▱
bar-progress-empty-foreground = #44607d
bar-progress-gradient = true
bar-progress-foreground-0 = ${colors.cyan}
bar-progress-foreground-1 = ${colors.blue}
bar-progress-foreground-2 = ${colors.magenta}
bar-progress-foreground-3 = ${colors.green}
bar-progress-fill-font = 6
bar-progress-empty-font = 6
bar-progress-indicator-font = 6