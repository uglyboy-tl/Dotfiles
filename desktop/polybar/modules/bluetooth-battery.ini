[module/bluetooth-battery]
type = custom/script

format = <label>
format-offset = 8pt
format-underline = ${colors.blue}
format-prefix = 
format-prefix-font = 2
format-prefix-padding = 1
format-prefix-foreground = ${colors.background}
format-prefix-background = ${colors.blue}

exec = $HOME/.local/share/dotfiles/desktop/polybar/scripts/bluetooth-battery.sh
interval = 30

label = %output%
label-font = 5
label-padding = 1
label-background = ${colors.semi-trans}
