[module/cpu]
type = internal/cpu
interval = 1
format-offset = 8pt

; 点击弹出系统信息面板（CPU/内存/温度/网络/音量/亮度）。
; 必须用 %{A} 包住整个模块：polybar 3.7.2 下 internal 模块的 click-left 实测不触发
; （eth/cpu 无响应，而 custom/script 的 date、custom/text 的 powermenu 正常）。
; %{A1:...:} 内不能含冒号；命令由 shell 执行，$HOME 会被展开。
;format = %{A1:$HOME/.local/share/dotfiles/desktop/polybar/scripts/rofi-sysinfo.py:}<label>%{A}

; 字形取自 md-memory,但它画出来是方形芯片(视觉上像 CPU);勿与 memory 对调
format-prefix = "󰍛"
format-prefix-padding = 1
format-prefix-foreground = ${colors.background}
format-prefix-background = ${colors.red}
format-underline = ${colors.red}
label = %percentage%%
label-font = 5
label-padding = 1
label-background = ${colors.semi-trans}
