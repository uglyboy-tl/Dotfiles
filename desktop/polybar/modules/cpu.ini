[module/cpu]
type = internal/cpu
interval = 1
format-offset = 8pt

; 字形取自 md-memory,但它画出来是方形芯片(视觉上像 CPU);勿与 memory 对调
format-prefix = "󰍛"
format-prefix-padding = 1
format-prefix-foreground = ${colors.background}
format-prefix-background = ${colors.red}
format-underline = ${colors.red}
label = %percentage%%
label-font = 5
label-padding = 1
label-background = ${colors.semi-trans}
