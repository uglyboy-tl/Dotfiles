[module/cpu]
type = internal/cpu
interval = 1
format-offset = 8pt

; 点击弹出系统信息面板（当前停用：format 未启用，见下方注释行）（CPU/内存/温度/网络/音量/亮度）
; 硬约束：polybar 3.7.2 下 internal 模块的 click-left 不触发，须用 %{A} 包住整个模块；
; %{A1:...:} 内不能含冒号；命令由 shell 执行，$HOME 会展开。
;format = %{A1:$HOME/.local/share/dotfiles/desktop/polybar/scripts/rofi-sysinfo.py:}<label>%{A}

; 字形取自 md-memory 但画出来是方形芯片（像 CPU），勿与 memory 对调
format-prefix = "󰍛"
format-prefix-padding = 1
format-prefix-foreground = ${colors.background}
format-prefix-background = ${colors.red}
format-underline = ${colors.red}
label = %percentage%%
label-font = 5
label-padding = 1
label-background = ${colors.semi-trans}
