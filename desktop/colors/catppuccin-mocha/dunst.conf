# Catppuccin Mocha - dunst 颜色配置（drop-in）
# 与 rofi/polybar 使用同一套主题色

[global]
    # 通知窗口边框颜色（lighter-background）
    frame_color = "#313244"
    # 分隔线颜色：跟随边框
    separator_color = frame
    # 进度条高亮颜色（selection 蓝）
    highlight = "#89b4fa"

[urgency_low]
    background = "#313244"
    foreground = "#a6adc8"
    frame_color = "#313244"

[urgency_normal]
    background = "#1e1e2e"
    foreground = "#cdd6f4"
    frame_color = "#313244"

[urgency_critical]
    background = "#f38ba8"
    foreground = "#11111b"
    frame_color = "#f38ba8"
