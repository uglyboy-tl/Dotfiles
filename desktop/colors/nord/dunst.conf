# Nord - dunst 颜色配置（drop-in）
# 与 rofi/polybar 使用同一套主题色

[global]
    # 通知窗口边框颜色（nord3）
    frame_color = "#4c566a"
    # 分隔线颜色：跟随边框
    separator_color = frame
    # 进度条高亮颜色（nord10 蓝）
    highlight = "#5e81ac"

[urgency_low]
    background = "#4c566a"
    foreground = "#d8dee9"
    frame_color = "#4c566a"

[urgency_normal]
    background = "#2e3440"
    foreground = "#eceff4"
    frame_color = "#4c566a"

[urgency_critical]
    background = "#bf616a"
    foreground = "#eceff4"
    frame_color = "#bf616a"
