# Picom 配置文件 - 窗口合成器

#################################
#             圆角              #
#################################

corner-radius = 10.0; # 窗口圆角半径
rounded-corners-exclude = [ # 排除以下窗口不使用圆角
  "window_type = 'desktop'", # 桌面窗口
  "window_type = 'toolbar'", # 工具栏
  "window_type = 'splash'"   # 启动画面
];

#################################
#             阴影              #
#################################

shadow = true; # 启用阴影
shadow-exclude = [ # 排除以下窗口不显示阴影
  "_GTK_FRAME_EXTENTS@", # GTK 框架扩展
  "window_type = 'menu' && _NET_WM_STATE@ = '_NET_WM_STATE_ABOVE'", # 菜单窗口且置顶
  "class_g = 'Dunst'",    # 通知（所有通知在同一个窗口，整块阴影很怪 -> 不要）
  "class_g = 'wemeetapp'" # 腾讯会议
];

shadow-radius = 4;    # 阴影模糊半径（配合 10px 窗口间距）
shadow-opacity = 0.5; # 阴影不透明度
shadow-offset-x = 1;  # 阴影 X 轴偏移（正值向右）
shadow-offset-y = 2;  # 阴影 Y 轴偏移（正值向下）

#################################
#             淡入淡出          #
#################################

fading = true;       # 启用淡入淡出效果
fade-in-step = 0.03; # 淡入步长
fade-out-step = 0.03; # 淡出步长

#################################
#         透明度 / 不透明度     #
#################################
active-opacity = 0.90;      # 焦点窗口不透明度
inactive-opacity = 0.80;    # 非焦点窗口不透明度（优化）

inactive-opacity-override = false; # 不覆盖非活动窗口的透明度设置

# 针对特定窗口类型的配置
wintypes: {
  tooltip = { shadow = false; fade = false; focus = true; full-shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.80; };
  dropdown_menu = { opacity = 0.80; };
};

opacity-rule = [ # 针对特定窗口的透明度规则
  "85:class_g = 'Polybar'",           # Polybar 状态栏 85% 不透明
  "90:class_g = 'Alacritty' && focused",    # 焦点 Alacritty 终端 90% 不透明
  "70:class_g = 'Alacritty' && !focused",   # 非焦点 Alacritty 终端 70% 不透明
  "100:class_g = 'feh' && focused",         # 焦点 feh 图片查看器 100% 不透明
  "70:class_g = 'feh' && !focused",         # 非焦点 feh 图片查看器 70% 不透明
  "80:class_g = 'Rofi'",              # Rofi 启动器 80% 不透明
  "80:name = 'Fcitx5 Input Window'",  # Fcitx5 候选栏 80% 不透明（用 name 避免影响托盘）
  "80:class_g = 'wechat'"             # 微信 80% 不透明
];

#################################
#             模糊              #
#################################

blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
  "class_g = 'Dunst'", # 通知：窗口内透明的通知间隙不应变成玻璃模糊
  "class_g = 'slop'"
];

#################################
#         通用设置              #
#################################
inactive-dim = 0.0;          # 非活动窗口的亮度降低程度 (0.0 表示不降低)
mark-wmwin-focused = true;   # 标记焦点窗口
mark-overdir-focused = true; # 标记鼠标悬停的窗口
detect-rounded-corners = true; # 检测窗口是否为圆角
detect-client-opacity = true;  # 检测客户端是否设置了透明度
detect-transient = true;       # 检测临时窗口关系（新增）

# 后端设置
backend = "glx";             # 使用 GLX 后端（适合 NVIDIA GPU）

# 性能优化
vsync = true;                # 启用垂直同步（防止撕裂）
xrender-sync-fence = true;   # 启用 XRender 同步栅栏（NVIDIA 兼容性）
unredir-if-possible = true;  # 全屏不透明窗口时解除重定向（提升视频/游戏性能）

# NVIDIA + GLX 修复设置
use-damage = true;            # 启用 damage 追踪（只重绘变化区域，提升性能）
