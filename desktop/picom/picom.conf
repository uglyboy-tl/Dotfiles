# Picom 配置 - 窗口合成器
# 硬约束：一旦定义 rules，旧的 rounded-corners-exclude / shadow-exclude / blur-background-exclude /
#   active-opacity / inactive-opacity / inactive-dim / wintypes / opacity-rule / mark-*-focused 全部失效。

# 圆角
corner-radius = 10.0; # 窗口圆角半径（按窗口排除见下方 rules 段）

# 阴影
shadow = true;        # 启用阴影（按窗口排除见下方 rules 段）
shadow-radius = 4;    # 阴影模糊半径（配合 10px 窗口间距）
shadow-opacity = 0.5; # 阴影不透明度
shadow-offset-x = 1;  # 阴影 X 轴偏移（正值向右）
shadow-offset-y = 2;  # 阴影 Y 轴偏移（正值向下）

# 淡入淡出
fading = true;        # 启用淡入淡出效果
fade-in-step = 0.03;  # 淡入步长
fade-out-step = 0.03; # 淡出步长

# 模糊
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;         # 按窗口排除见下方 rules 段
blur-background-frame = false;
blur-background-fixed = false;

# 窗口规则：按书写顺序匹配，同一选项以最后命中者为准，故默认值在前、特例在后。
rules = (
  # 默认不透明度：只作用于没自带 _NET_WM_WINDOW_OPACITY 的窗口，不覆盖 picom-trans 设的值
  { match = "! _NET_WM_WINDOW_OPACITY"; opacity = 0.80; },

  # 活动窗口
  { match = "focused || group_focused || wmwin || override_redirect"; opacity = 0.90; },

  # 圆角排除：桌面、工具栏、splash；桌面宠物整窗透明，圆角无意义
  { match = "window_type = 'desktop' || window_type = 'toolbar' || window_type = 'splash' || class_g = 'open-pets-desktop'"; corner-radius = 0; },
  # rules 模式下全屏窗口不再自动去圆角，必须显式关
  { match = "fullscreen"; corner-radius = 0; },

  # 阴影排除：_GTK_FRAME_EXTENTS@ = GTK 框架扩展；menu 且置顶 = 菜单窗口
  { match = "_GTK_FRAME_EXTENTS@ || (window_type = 'menu' && _NET_WM_STATE@ = '_NET_WM_STATE_ABOVE') || class_g = 'Dunst' || class_g = 'wemeetapp' || class_g = 'open-pets-desktop'"; shadow = false; },
  # Dunst = 通知（同一窗口，整块阴影很怪）；open-pets-desktop = 整窗透明，加阴影会露出矩形边

  # 模糊排除：Dunst = 通知内透明的间隙不该变成玻璃模糊
  { match = "class_g = 'Dunst' || class_g = 'open-pets-desktop' || class_g = 'slop'"; blur-background = false; },

  # 窗口类型
  { match = "window_type = 'tooltip'"; shadow = false; fade = false; full-shadow = false; },
  { match = "window_type = 'dnd'"; shadow = false; },
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'"; opacity = 0.80; },

  # 各应用不透明度
  { match = "class_g = 'Polybar'"; opacity = 0.85; },            # Polybar 状态栏 85%
  { match = "class_g = 'Alacritty' && focused"; opacity = 0.90; },  # 焦点 Alacritty 终端 90%
  { match = "class_g = 'Alacritty' && !focused"; opacity = 0.70; }, # 非焦点 Alacritty 终端 70%
  { match = "class_g = 'feh' && focused"; opacity = 1.0; },         # 焦点 feh 图片查看器 100%
  { match = "class_g = 'feh' && !focused"; opacity = 0.70; },       # 非焦点 feh 图片查看器 70%
  { match = "class_g = 'Rofi'"; opacity = 0.80; },               # Rofi 启动器 80%
  # 用 name 而非 class 避免影响 Fcitx5 托盘
  { match = "name = 'Fcitx5 Input Window'"; opacity = 0.80; },   # Fcitx5 候选栏 80%
  { match = "class_g = 'wechat'"; opacity = 0.80; },             # 微信 80%

  # _POLYBAR_FLAT 由 settings 的「Polybar 悬浮效果」开关写入；rules 模式下 _COMPTON_SHADOW 失效
  { match = "class_g = 'Polybar' && _POLYBAR_FLAT"; shadow = false; blur-background = false; },
);

# 通用设置
detect-rounded-corners = true; # 检测窗口是否为圆角
detect-client-opacity = true;  # 检测客户端是否设置了透明度
detect-transient = true;       # 检测临时窗口关系（group_focused 依赖它）

# 后端设置
backend = "glx";             # 使用 GLX 后端（适合 NVIDIA GPU）

# 性能优化
vsync = true;                # 启用垂直同步（防止撕裂）
xrender-sync-fence = true;   # 启用 XRender 同步栅栏（NVIDIA 兼容性）
unredir-if-possible = true;  # 全屏不透明窗口时解除重定向（提升视频/游戏性能）

# NVIDIA + GLX 修复设置
use-damage = true;           # 启用 damage 追踪（只重绘变化区域，提升性能）
