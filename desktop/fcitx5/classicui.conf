# 垂直候选列表
Vertical Candidate List=False
# 按每个屏幕 DPI 显示
PerScreenDPI=True
# 使用鼠标滚轮翻页
WheelForPaging=True
# 字体
Font="LXGW WenKai GB Screen 12"
# 菜单字体
MenuFont="LXGW WenKai GB Screen 12"
# 托盘字体
TrayFont="Maple Mono SC NF:size=12"
# 托盘标签轮廓颜色（固定中性色，跨主题通用）
TrayOutlineColor=#B0B0B0
# 托盘标签文本颜色（固定中性色，跨主题通用）
TrayTextColor=#E0E0E0
# 优先使用文字图标
PreferTextIcon=True
# 在图标中显示布局名称
ShowLayoutNameInIcon=False
# 使用输入法的语言来显示文字
UseInputMethodLanguageToDisplayText=True
# 主题（由主题系统渲染 theme.conf，名字固定为 dotfiles）
Theme=dotfiles
# 固定 Wayland 的字体 DPI
ForceWaylandDPI=0
