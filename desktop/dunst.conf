# vim: ft=cfg
#
# Dunst 通知管理器配置文件 - 优化精简版
# 颜色部分由 dunstrc.d/ 下的 drop-in 文件提供（主题脚本统一管理）

[global]
	# 显示设置
	follow = mouse
	idle_threshold = 120

	# 几何设置
	width = 325
	height = (0, 120)

	# 外观设置
	transparency = 10
	padding = 18
	horizontal_padding = 16
	frame_width = 2
	corner_radius = 10

	# 文本设置
	font = Maple Mono Normal CN 12
	line_height = 4
	format = "%s\n%b"

	# 图标设置 - 使用 Adwaita symbolic 图标
	icon_path = /usr/share/icons/Adwaita/symbolic/status/:/usr/share/icons/Adwaita/scalable/status/:/usr/share/icons/Adwaita/symbolic/devices/
	max_icon_size = 64

	# 启用堆叠重复通知（避免重复通知堆积）
	stack_duplicates = true

	# 圆角设置
	corners = all

	# 应用集成
	dmenu = /usr/bin/rofi -dmenu -p dunst:
	browser = /usr/bin/microsoft-edge -new-tab

# 紧急程度 - 停留时长
# 常规通知 3~5 秒；音量/亮度指示由 barify 用 -t 另行缩短，不受此影响
[urgency_low]
	timeout = 3

[urgency_normal]
	timeout = 5

[urgency_critical]
	timeout = 10
