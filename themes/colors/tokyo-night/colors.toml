# 主题色定义。只写「事实」——16 个 ANSI 槽 + background/foreground/selection_*，
# 全部取自上游官方配置：
#   folke/tokyonight.nvim/extras/alacritty/tokyonight_night.toml
# UI 派生色（dark_background / dark_foreground / light_foreground / muted /
# accent / orange / selection）由 settings/lib/render.sh 计算，不要手填。
mode = "dark"

background           = "#1a1b26"
foreground           = "#c0caf5"
selection_background = "#283457"
selection_foreground = "#c0caf5"

# ANSI 16 色（顺序固定：0-7 normal，8-15 bright）
black                = "#15161e"   # 0 black
red                  = "#f7768e"   # 1 red
green                = "#9ece6a"   # 2 green
yellow               = "#e0af68"   # 3 yellow
blue                 = "#7aa2f7"   # 4 blue
magenta              = "#bb9af7"   # 5 magenta
cyan                 = "#7dcfff"   # 6 cyan
white                = "#a9b1d6"   # 7 white
bright_black         = "#414868"   # 8 bright black
bright_red           = "#ff899d"   # 9 bright red
bright_green         = "#9fe044"   # 10 bright green
bright_yellow        = "#faba4a"   # 11 bright yellow
bright_blue          = "#8db0ff"   # 12 bright blue
bright_magenta       = "#c7a9ff"   # 13 bright magenta
bright_cyan          = "#a4daff"   # 14 bright cyan
bright_white         = "#c0caf5"   # 15 bright white
