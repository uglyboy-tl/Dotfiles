# 主题色定义。只写「事实」——16 个 ANSI 槽 + background/foreground/selection_*，
# 全部取自上游官方配置：
#   catppuccin/alacritty/catppuccin-mocha.toml
# UI 派生色（dark_background / dark_foreground / light_foreground / muted /
# accent / orange / selection）由 settings/lib/render.sh 计算，不要手填。
mode = "dark"

background           = "#1e1e2e"
foreground           = "#cdd6f4"
selection_background = "#f5e0dc"
selection_foreground = "#1e1e2e"

# ANSI 16 色（顺序固定：0-7 normal，8-15 bright）
black                = "#45475a"   # 0 black
red                  = "#f38ba8"   # 1 red
green                = "#a6e3a1"   # 2 green
yellow               = "#f9e2af"   # 3 yellow
blue                 = "#89b4fa"   # 4 blue
magenta              = "#f5c2e7"   # 5 magenta
cyan                 = "#94e2d5"   # 6 cyan
white                = "#bac2de"   # 7 white
bright_black         = "#585b70"   # 8 bright black
bright_red           = "#f38ba8"   # 9 bright red
bright_green         = "#a6e3a1"   # 10 bright green
bright_yellow        = "#f9e2af"   # 11 bright yellow
bright_blue          = "#89b4fa"   # 12 bright blue
bright_magenta       = "#f5c2e7"   # 13 bright magenta
bright_cyan          = "#94e2d5"   # 14 bright cyan
bright_white         = "#a6adc8"   # 15 bright white
