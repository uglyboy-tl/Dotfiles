# 主题渲染声明：哪个应用用哪个模板、输出到哪、如何重载。
# 字段（`|` 分隔，空字段也保留分隔符）:
#   应用 | 模板文件 | 输出路径(相对 XDG_CONFIG_HOME) | 重载命令 | 标记
# 标记: always = 始终渲染（不判断应用是否安装）
# 有模板文件不代表一定渲染，必须以本文件声明为准。
#
# 应用         模板                  输出                            重载命令
rofi|rofi.rasi.tpl|rofi/colors.rasi||
polybar|polybar.ini.tpl|polybar/colors.ini||
dunst|dunst.conf.tpl|dunst/dunstrc.d/colors.conf|dunstctl reload|
alacritty|alacritty.toml.tpl|alacritty/colors.toml||
ghostty|ghostty.conf.tpl|ghostty/colors.conf|pkill -USR2 -x ghostty|
urxvt|rxvt.tpl|X11/Xresources.d/rxvt-colors|xrdb -merge $XDG_CONFIG_HOME/X11/Xresources|
zathura|zathura.conf.tpl|zathura/colors.conf||
bspwm|bspwm.sh.tpl|bspwm/colors.sh|bspc wm -r|
gtk3|gtk3.css.tpl|gtk-3.0/gtk.css||always
gtk4|gtk4.css.tpl|gtk-4.0/gtk.css||always
