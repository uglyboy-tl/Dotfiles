onboarding = false

[server]
# 无客户端附着时的虚拟终端尺寸，供后台编排读取 pane 输出
headless_cols = 160
headless_rows = 50

[theme]
name = "terminal"
auto_switch = false

[ui]
accent = "blue"
pane_gaps = false
pane_outer_borders = false
confirm_close = false
window_title = "{hostname}: {workspace}"

status_indicators = "symbols"
# blocked/done 的 agent 排到侧边栏最前
agent_panel_sort = "priority"
# 只有一个 tab 时不占一行
tab_bar_position = "top"
hide_tab_bar_when_single_tab = true
tab_bar_right = [
  { type = "hostname" },
  { type = "datetime", format = "%m-%d %H:%M" },
]

# 侧栏 Agents 区：每个 agent 一行。
# 默认显示终端标题（含项目名与状态），能区分不同项目的 agent；
# pi 另有扩展上报的 $task 任务名，比标题更干净，故单独覆盖。
# 任务名由 config/pi/extensions/herdr-sidebar-task.ts 写入。
[ui.sidebar.agents]
rows = [["state_icon", "terminal_title_stripped"]]

[ui.sidebar.agents.rows_by_agent]
pi = [["state_icon", "$task"]]

# 侧栏 Spaces 区：每个 space 一行，branch 只在 git 仓库里有值，其余自动消失。
[ui.sidebar.spaces]
rows = [["state_icon", "workspace", "branch"]]

[keys]
prefix = "ctrl+a"
detach = "prefix+d"

# Panes
split_horizontal = ["prefix+-", "alt+enter"]
split_vertical = ["prefix+|", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]

new_tab = "prefix+c"
new_workspace = "prefix+shift+c"

[ui.toast]
delivery = "system"
