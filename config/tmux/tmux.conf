# ──────────────────────────────────────────────
# 插件列表（TPM 管理）
# ──────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'https://github.com/tmux-plugins/tmux-sensible'
set -g @plugin 'https://github.com/tmux-plugins/tmux-pain-control'
set -g @plugin 'https://github.com/arcticicestudio/nord-tmux'
set -g @plugin 'https://github.com/tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'https://github.com/MunifTanjim/tmux-suspend'

# 自动安装 TPM
if "test ! -d ~/.local/share/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm && ~/.local/share/tmux/plugins/tpm/bin/install_plugins'"

# ──────────────────────────────────────────────
# 前缀键
# ──────────────────────────────────────────────
set-option -g prefix C-a
unbind-key C-a
bind-key C-a send-prefix
bind a last-window

# ──────────────────────────────────────────────
# 通用设置
# ──────────────────────────────────────────────
set-option -g default-terminal screen-256color
set -g base-index 1
setw -g pane-base-index 1
set -g focus-events on
set -g detach-on-destroy off
set -g escape-time 0
set -g aggressive-resize on
set -g allow-passthrough on

# ──────────────────────────────────────────────
# 显示设置
# ──────────────────────────────────────────────
setw -g automatic-rename on
set -g renumber-windows on
set -g set-clipboard on
set -g display-panes-time 800
set -g display-time 500
set -g status-interval 10
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u
setw -g monitor-activity on
set -g visual-activity off

# ──────────────────────────────────────────────
# 快捷键
# ──────────────────────────────────────────────
bind-key p display-popup -E -w 80% -h 80%

# ──────────────────────────────────────────────
# 状态栏插件配置
# ──────────────────────────────────────────────
set -g @prefix_highlight_prefix_prompt ' WAIT '
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_prompt ' COPY '

# ──────────────────────────────────────────────
# 本地覆盖
# ──────────────────────────────────────────────
if-shell "[ -f ~/.config/local/tmux ]" 'source ~/.local/config/local/tmux'

# ──────────────────────────────────────────────
# TPM 初始化（必须最底部）
# ──────────────────────────────────────────────
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins'
run '~/.local/share/tmux/plugins/tpm/tpm'
